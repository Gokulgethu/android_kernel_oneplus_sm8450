name: Build Yazhu Kernel (Flashable Zip)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release after build'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  KERNEL_NAME: yazhu
  DEVICE_CODENAME: udon
  DEVICE_MODEL: OnePlus 11R
  SOC: SM8475
  KSU_VERSION_TAG: v1.0.5

jobs:
  build:
    name: Build Flashable Kernel Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git kmod libelf-dev libncurses5-dev libssl-dev lz4 python3 python3-pip wget zip unzip gcc-aarch64-linux-gnu

      - name: Set up Clang/LLVM
        run: |
          mkdir -p toolchain && cd toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz -O clang.tar.gz 2>/dev/null || wget -q https://github.com/nicholasgasior/clang-builds/releases/download/clang-18/clang-18-linux-x86_64.tar.xz -O clang.tar.xz 2>/dev/null
          if [ ! -f clang.tar.gz ] && [ ! -f clang.tar.xz ]; then
            sudo apt-get install -y clang-18 lld-18 llvm-18
            sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
            sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100
            sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-18 100
            sudo update-alternatives --install /usr/bin/llvm-nm llvm-nm /usr/bin/llvm-nm-18 100
            sudo update-alternatives --install /usr/bin/llvm-strip llvm-strip /usr/bin/llvm-strip-18 100
            sudo update-alternatives --install /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-18 100
            sudo update-alternatives --install /usr/bin/llvm-objdump llvm-objdump /usr/bin/llvm-objdump-18 100
          else
            [ -f clang.tar.gz ] && tar xf clang.tar.gz || tar xf clang.tar.xz
            echo "$(pwd)/bin" >> $GITHUB_PATH
          fi
          cd .. && clang --version

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-sm8450
          max-size: 2G

      - name: Install KernelSU v1.0.5 (stable for 5.10)
        run: |
          echo "=== Installing KernelSU ${{ env.KSU_VERSION_TAG }} ==="
          [ -d drivers/kernelsu ] && echo "Old KSU files: $(find drivers/kernelsu -type f | wc -l)" && rm -rf drivers/kernelsu
          git clone --depth 1 --branch ${{ env.KSU_VERSION_TAG }} https://github.com/tiann/KernelSU.git /tmp/ksu
          cp -r /tmp/ksu/kernel drivers/kernelsu
          rm -rf drivers/kernelsu/.vscode drivers/kernelsu/.clangd* drivers/kernelsu/.gitignore drivers/kernelsu/build-all*.sh drivers/kernelsu/setup.sh
          echo "KernelSU v1.0.5 installed: $(find drivers/kernelsu -type f | wc -l) files"
          test -f drivers/kernelsu/kernel_compat.c && echo "kernel_compat.c: OK"
          test -f drivers/kernelsu/Kconfig && echo "Kconfig: OK"
          test -f drivers/kernelsu/Makefile && echo "Makefile: OK"
          rm -rf /tmp/ksu

      - name: Verify build system integration
        run: |
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo "drivers/Makefile: $(grep kernelsu drivers/Makefile)"
          echo "drivers/Kconfig: $(grep kernelsu drivers/Kconfig)"

      - name: Get kernel version
        id: version
        run: |
          V=$(grep "^VERSION = " Makefile | awk '{print $3}')
          P=$(grep "^PATCHLEVEL = " Makefile | awk '{print $3}')
          S=$(grep "^SUBLEVEL = " Makefile | awk '{print $3}')
          LV=$(cat localversion 2>/dev/null || echo "")
          KV="${V}.${P}.${S}${LV}"
          echo "version=${KV}" >> $GITHUB_OUTPUT
          echo "Kernel version: ${KV}"

      - name: Configure kernel (with safety configs)
        run: |
          export ARCH=arm64 LLVM=1 CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm
          export STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump HOSTCC="ccache clang" HOSTLD=ld.lld
          make O=out gki_defconfig vendor/waipio_GKI.config vendor/oplus_GKI.config vendor/boot_safety.config
          echo "=== Critical configs ==="
          grep -E "CONFIG_(MODVERSIONS|KALLSYMS=|MODULES=|OVERLAY_FS|KPROBES=|KSU|SELINUX=|MODULE_SIG)" out/.config | head -15

      - name: Build kernel
        run: |
          export ARCH=arm64 LLVM=1 CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm
          export STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump HOSTCC="ccache clang" HOSTLD=ld.lld
          make O=out -j$(nproc) 2>&1 | tee build.log
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "::error::Kernel Image not found!"
            tail -50 build.log
            exit 1
          fi
          echo "Image: $(ls -lah out/arch/arm64/boot/Image)"
          strings out/arch/arm64/boot/Image | grep "Linux version" | head -1

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel3
          rm -rf anykernel3/.git

      - name: Configure AnyKernel3
        run: |
          cp anykernel_udon.sh anykernel3/anykernel.sh
          echo "AnyKernel3 configured from repo file"
          cat anykernel3/anykernel.sh | head -5

      - name: Copy kernel to AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image anykernel3/
          cp out/arch/arm64/boot/Image.gz anykernel3/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.lz4 anykernel3/ 2>/dev/null || true
          cp out/arch/arm64/boot/dtb anykernel3/ 2>/dev/null || true
          find out/arch/arm64/boot/dts -name "*.dtbo" -exec cp {} anykernel3/ \; 2>/dev/null || true
          ls -lah anykernel3/Image* anykernel3/dtb* 2>/dev/null

      - name: Create flashable zip
        run: |
          KV="${{ steps.version.outputs.version }}"
          ZIP="yazhu-kernel-${KV}-udon-${{ github.run_number }}.zip"
          cd anykernel3 && zip -r9 "../${ZIP}" . -x '*.git*' 'README.md' '.github/*' && cd ..
          echo "ZIP_NAME=${ZIP}" >> $GITHUB_ENV
          echo "Zip: $(du -h ${ZIP} | cut -f1)"
          unzip -l "${ZIP}" | head -20

      - name: Validate build output
        run: |
          echo "=== Build Validation ==="
          echo "1. Image:" && file out/arch/arm64/boot/Image
          echo "2. Version:" && strings out/arch/arm64/boot/Image | grep "Linux version" | head -1
          echo "3. KSU:" && grep CONFIG_KSU out/.config
          echo "4. Safety configs:"
          grep -E "CONFIG_(MODVERSIONS|KALLSYMS=|MODULE_SIG)" out/.config | grep -v "^#"
          echo "5. Zip:" && unzip -t "${ZIP_NAME}" | tail -3
          echo "6. Modules: $(find out -name '*.ko' | wc -l) .ko files"
          echo "=== PASSED ==="

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: yazhu-kernel-image-${{ steps.version.outputs.version }}
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.lz4
          retention-days: 30

      - name: Create release
        if: github.event.inputs.release == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yazhu-${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: "Yazhu Kernel ${{ steps.version.outputs.version }}"
          body: |
            Yazhu Kernel ${{ steps.version.outputs.version }}
            Device: ${{ env.DEVICE_MODEL }} (${{ env.DEVICE_CODENAME }})
            KernelSU: ${{ env.KSU_VERSION_TAG }} (stable)
            Boot Safety: MODVERSIONS + MODULE_SIG=n + safety config applied
            Compatible with: OxygenOS, PixelOS, LineageOS, any AOSP ROM
            Flash via TWRP/OrangeFox recovery. KernelSU Manager APK needed for root.
            Recovery if bootloop: fastboot flash boot stock_boot.img
          files: |
            ${{ env.ZIP_NAME }}
            out/arch/arm64/boot/Image
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: always()
        run: |
          echo "## Yazhu Kernel Build" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| KernelSU | ${{ env.KSU_VERSION_TAG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          [ -f build.log ] && echo '```' >> $GITHUB_STEP_SUMMARY && tail -30 build.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY

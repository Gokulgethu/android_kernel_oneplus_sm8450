name: Build Yazhu Kernel (Flashable Zip)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release after build'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  KERNEL_NAME: yazhu
  DEVICE_CODENAME: udon
  DEVICE_MODEL: OnePlus 11R
  SOC: SM8475 (Snapdragon 8+ Gen 1)

jobs:
  build:
    name: Build Flashable Kernel Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio flex git kmod \
            libelf-dev libncurses5-dev libssl-dev lz4 \
            python3 python3-pip wget zip unzip \
            gcc-aarch64-linux-gnu

      - name: Set up Clang/LLVM
        run: |
          mkdir -p toolchain
          cd toolchain
          
          # Download Android clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz -O clang.tar.gz 2>/dev/null || \
          wget -q https://github.com/nicholasgasior/clang-builds/releases/download/clang-18/clang-18-linux-x86_64.tar.xz -O clang.tar.xz 2>/dev/null
          
          # Fallback to system clang if downloads fail
          if [ ! -f clang.tar.gz ] && [ ! -f clang.tar.xz ]; then
            echo "Using system clang"
            sudo apt-get install -y clang-18 lld-18 llvm-18
            sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
            sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100
            sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-18 100
            sudo update-alternatives --install /usr/bin/llvm-nm llvm-nm /usr/bin/llvm-nm-18 100
            sudo update-alternatives --install /usr/bin/llvm-strip llvm-strip /usr/bin/llvm-strip-18 100
            sudo update-alternatives --install /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-18 100
            sudo update-alternatives --install /usr/bin/llvm-objdump llvm-objdump /usr/bin/llvm-objdump-18 100
          else
            if [ -f clang.tar.gz ]; then
              tar xf clang.tar.gz
            elif [ -f clang.tar.xz ]; then
              tar xf clang.tar.xz
            fi
            echo "$(pwd)/bin" >> $GITHUB_PATH
          fi
          
          cd ..
          echo "Clang version:"
          clang --version

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-sm8450
          max-size: 2G

      - name: Get kernel version
        id: version
        run: |
          VERSION=$(grep "^VERSION = " Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep "^PATCHLEVEL = " Makefile | awk '{print $3}')
          SUBLEVEL=$(grep "^SUBLEVEL = " Makefile | awk '{print $3}')
          LOCALVERSION=$(cat localversion 2>/dev/null || echo "")
          KERNEL_VERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}${LOCALVERSION}"
          echo "version=${KERNEL_VERSION}" >> $GITHUB_OUTPUT
          echo "Kernel version: ${KERNEL_VERSION}"

      - name: Configure kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export STRIP=llvm-strip
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export HOSTCC=clang
          export HOSTLD=ld.lld
          
          # Use ccache
          export CC="ccache clang"
          export HOSTCC="ccache clang"
          
          # Configure with GKI defconfig + vendor fragments
          make O=out \
            gki_defconfig \
            vendor/waipio_GKI.config \
            vendor/oplus_GKI.config
          
          echo ""
          echo "=== Kernel configuration summary ==="
          grep -E "CONFIG_LOCALVERSION|CONFIG_KSU|CONFIG_KPROBES" out/.config | head -10

      - name: Build kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export CC="ccache clang"
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export STRIP=llvm-strip
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export HOSTCC="ccache clang"
          export HOSTLD=ld.lld
          
          NPROC=$(nproc)
          echo "Building with ${NPROC} threads"
          
          make O=out -j${NPROC} 2>&1 | tee build.log
          
          echo ""
          echo "=== Build complete ==="
          ls -lah out/arch/arm64/boot/Image 2>/dev/null || echo "Image not found"

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel3
          cd anykernel3
          # Remove git history to reduce size
          rm -rf .git
          cd ..
          echo "AnyKernel3 cloned successfully"

      - name: Configure AnyKernel3 for OnePlus 11R
        run: |
          cd anykernel3
          
          # Create anykernel.sh configuration
          cat > anykernel.sh << 'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=yazhu-5.10.246 by Gokulgethu
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=udon
          device.name2=OP535DL1
          device.name3=CPH2487
          device.name4=CPH2423
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          # shell variables
          block=auto;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          ## AnyKernel methods (DO NOT CHANGE)
          # import patching functions/variables - see for reference
          . tools/ak3-core.sh;

          ## AnyKernel file attributes
          # set permissions/ownership for included ramdisk files
          # set_perm_recursive 0 0 755 644 $ramdisk/*;
          # set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;

          ## AnyKernel boot install
          dump_boot;

          # begin ramdisk changes
          # (no ramdisk changes needed for this kernel)
          # end ramdisk changes

          write_boot;
          ## end boot install

          EOF
          
          echo "AnyKernel3 configured for OnePlus 11R (udon)"

      - name: Copy kernel to AnyKernel3
        run: |
          # Copy kernel Image
          cp out/arch/arm64/boot/Image anykernel3/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz anykernel3/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.lz4 anykernel3/ 2>/dev/null || true
          
          # Copy DTB if exists
          cp out/arch/arm64/boot/dtb anykernel3/ 2>/dev/null || true
          
          # Copy DTBO if exists
          find out/arch/arm64/boot/dts -name "*.dtbo" -exec cp {} anykernel3/ \; 2>/dev/null || true
          find out/arch/arm64/boot/dts/qcom -name "*.dtb" -exec cp {} anykernel3/dtb \; 2>/dev/null || true
          
          echo "=== Files in AnyKernel3 ==="
          ls -lah anykernel3/

      - name: Create flashable zip
        run: |
          KERNEL_VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="yazhu-kernel-${KERNEL_VERSION}-udon-${{ github.run_number }}.zip"
          
          cd anykernel3
          zip -r9 "../${ZIP_NAME}" . -x '*.git*' 'README.md'
          cd ..
          
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo ""
          echo "=== Flashable zip created ==="
          ls -lah "${ZIP_NAME}"
          echo "Size: $(du -h "${ZIP_NAME}" | cut -f1)"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: yazhu-kernel-image-${{ steps.version.outputs.version }}
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.lz4
          retention-days: 30

      - name: Create release
        if: github.event.inputs.release == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yazhu-${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: "Yazhu Kernel ${{ steps.version.outputs.version }} (Flashable Zip)"
          body: |
            ## 🐧 Yazhu Kernel ${{ steps.version.outputs.version }}
            
            **Device:** ${{ env.DEVICE_MODEL }} (${{ env.DEVICE_CODENAME }})
            **SoC:** ${{ env.SOC }}
            **KernelSU:** ✅ Integrated
            **Build Date:** ${{ github.event.head_commit.timestamp }}
            
            ### 📦 Contents
            - `${{ env.ZIP_NAME }}` — Flashable zip (AnyKernel3)
            - `Image` — Raw kernel image
            
            ### ⚡ Flash Instructions
            1. Download the flashable zip
            2. Boot into recovery (TWRP/OrangeFox/PE Recovery)
            3. Flash the zip
            4. Reboot
            
            **OR** via fastboot:
            ```bash
            # Extract Image from zip
            # Create boot.img with mkbootimg
            # Flash via: fastboot flash boot boot.img
            ```
            
            ### 🔧 KernelSU
            Install the KernelSU Manager APK to manage root access.
            
            ### ✅ Compatibility
            - OxygenOS (OOS)
            - PixelOS
            - LineageOS
            - Any AOSP-based ROM
            
            ### ⚠️ Notes
            - This is a kernel-only flash, no system modifications
            - Works on A/B slot devices (OnePlus 11R)
            - Preserves existing ramdisk and DTB from your ROM
          files: |
            ${{ env.ZIP_NAME }}
            out/arch/arm64/boot/Image
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: always()
        run: |
          echo "## 🐧 Yazhu Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | Yazhu ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Device | ${{ env.DEVICE_MODEL }} (${{ env.DEVICE_CODENAME }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| SoC | ${{ env.SOC }} |" >> $GITHUB_STEP_SUMMARY
          echo "| KernelSU | ✅ Enabled |" >> $GITHUB_STEP_SUMMARY
          echo "| Flashable Zip | ✅ ${{ env.ZIP_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f build.log ]; then
            echo "### Build Log (last 20 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

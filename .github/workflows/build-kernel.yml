name: Build udon Kernel (Universal Flashable — Image + DTBO + Modules)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release after build'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  KERNEL_NAME: yazhu
  DEVICE_CODENAME: udon
  DEVICE_MODEL: OnePlus 11R
  SOC: SM8450 (taro)
  KSU_VERSION_TAG: v1.0.5
  ARCH: arm64
  # rocko5498 proven config set (matches device tree exactly)
  DEFCONFIGS: "gki_defconfig vendor/waipio_GKI.config vendor/oplus_GKI.config vendor/debugfs.config vendor/boot_safety.config"
  # rocko5498 proven ext-module set (sm8450-common BoardConfigCommon)
  EXT_MODULES: |
    qcom/opensource/mmrm-driver
    qcom/opensource/audio-kernel
    qcom/opensource/camera-kernel
    qcom/opensource/dataipa/drivers/platform/msm
    qcom/opensource/datarmnet/core
    qcom/opensource/datarmnet-ext/aps
    qcom/opensource/datarmnet-ext/offload
    qcom/opensource/datarmnet-ext/shs
    qcom/opensource/datarmnet-ext/perf
    qcom/opensource/datarmnet-ext/perf_tether
    qcom/opensource/datarmnet-ext/sch
    qcom/opensource/datarmnet-ext/wlan
    qcom/opensource/display-drivers/msm
    qcom/opensource/eva-kernel
    qcom/opensource/video-driver
    qcom/opensource/wlan/qcacld-3.0/.qca6490

jobs:
  build:
    name: Build kernel + modules + DTBO + AnyKernel3 zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source (at kernel/oneplus/sm8450 so the dts/vendor symlink resolves)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: kernel/oneplus/sm8450

      - name: Checkout device devicetrees + kernel modules (symlink targets)
        run: |
          git clone --depth=1 https://github.com/rocko5498/android_kernel_oneplus_sm8450-devicetrees kernel/oneplus/sm8450-devicetrees
          git clone --depth=1 https://github.com/pjgowtham/android_kernel_oneplus_sm8450-modules kernel/oneplus/sm8450-modules
          # verify the boot-critical symlink resolves
          test -f kernel/oneplus/sm8450/arch/arm64/boot/dts/vendor/Makefile || { echo "::error::dts/vendor symlink broken"; exit 1; }
          echo "oplus board overlays via symlink: $(find kernel/oneplus/sm8450/arch/arm64/boot/dts/vendor -iname '*overlay*' | wc -l)"

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison cpio flex git kmod libelf-dev libssl-dev lz4 zip unzip \
            device-tree-compiler python3-dev python3-pip lld llvm
          sudo apt-get clean
          # Lineage dtc tools (fdtget/fdtput/fdtoverlay/fdtoverlaymerge) — merge_dtbs.py needs
          # fdtoverlaymerge, which stock Ubuntu dtc does not ship; install into /usr/local/bin
          # so they shadow the distro binaries
          git clone --depth=1 https://github.com/LineageOS/android_external_dtc /tmp/ldtc
          make -C /tmp/ldtc fdtoverlaymerge fdtget fdtput fdtoverlay -j$(nproc) CC=gcc EXTRA_CFLAGS="-w"
          sudo cp /tmp/ldtc/fdtoverlaymerge /tmp/ldtc/fdtget /tmp/ldtc/fdtput /tmp/ldtc/fdtoverlay /usr/local/bin/
          fdtoverlaymerge 2>&1 | head -1 || true
          # ufdt_apply_overlay (merge_dtbs post-save validation) is no longer shipped as a
          # standalone tool — make that validation non-fatal; merged outputs are already saved
          curl -sL https://raw.githubusercontent.com/LineageOS/android_vendor_lineage/lineage-23.2/build/tools/merge_dtbs.py -o /tmp/merge_dtbs.py
          python3 - <<'PY'
          s = open('/tmp/merge_dtbs.py').read()
          # P1: ufdt_apply_overlay no longer exists as a tool — make validation non-fatal
          old = "cmd = ['ufdt_apply_overlay', base.filename, dtbo.filename, '/dev/null']\n\t\tlogging.debug(' '.join(cmd))\n\t\tsubprocess.run(cmd, check=True)"
          new = "cmd = ['ufdt_apply_overlay', base.filename, dtbo.filename, '/dev/null']\n\t\tlogging.debug(' '.join(cmd))\n\t\ttry:\n\t\t\tsubprocess.run(cmd, check=True)\n\t\texcept Exception as e:\n\t\t\tlogging.warning('ufdt overlay validation skipped: %s' % e)"
          assert old in s, "P1 anchor not found"
          s = s.replace(old, new)
          # P3: uniquify output name on collision instead of asserting (two singleton trees
          # can resolve to the same basename, e.g. waipio-v2.dtb)
          old = '\t\tassert not os.path.exists(out_file), "Cannot overwrite: {}".format(out_file)'
          new = "\t\tif os.path.exists(out_file):\n\t\t\tname = name + '-' + format(abs(hash(self)), 'x')\n\t\t\tout_file = os.path.join(out_dir, name)"
          assert old in s, "P3 anchor not found"
          s = s.replace(old, new)
          open('/tmp/merge_dtbs.py','w').write(s)
          print("merge_dtbs.py patched: ufdt non-fatal, collision-uniquify")
          PY

      - name: Restore toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: clang-r487747c-yazhu

      - name: Set up Clang (r487747c — AOSP kernel toolchain) + ccache
        run: |
          mkdir -p $HOME/toolchain && cd $HOME/toolchain
          if [ -x bin/clang ]; then echo "toolchain cached"; exit 0; fi
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2023/clang-r487747c.tar.gz"
          ok=0
          for i in 1 2 3 4 5; do
            curl -sL --retry 3 --retry-delay 10 -C - "$URL" -o clang.tar.gz || true
            SZ=$(stat -c%s clang.tar.gz 2>/dev/null || echo 0)
            if [ "$SZ" -gt 200000000 ] && tar tzf clang.tar.gz >/dev/null 2>&1; then ok=1; break; fi
            echo "clang download attempt $i failed (size=$SZ), retrying in 15s"; sleep 15
          done
          [ "$ok" = 1 ] || { echo "clang download failed after retries"; exit 1; }
          tar xf clang.tar.gz
          [ -x bin/clang ] || { echo "clang binary missing after extract"; ls; exit 1; }
          echo "$HOME/toolchain/bin" >> $GITHUB_PATH
          $HOME/toolchain/bin/clang --version | head -1

      - name: Install KernelSU v1.0.5
        run: |
          cd kernel/oneplus/sm8450
          rm -rf drivers/kernelsu
          git clone --depth 1 --branch ${{ env.KSU_VERSION_TAG }} https://github.com/tiann/KernelSU.git /tmp/ksu
          cp -r /tmp/ksu/kernel drivers/kernelsu
          rm -rf drivers/kernelsu/.vscode drivers/kernelsu/.clangd* drivers/kernelsu/build-all*.sh
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo "KSU files: $(find drivers/kernelsu -type f | wc -l)"

      - name: Kernel version
        id: version
        run: |
          cd kernel/oneplus/sm8450
          V=$(grep "^VERSION = " Makefile | awk '{print $3}')
          P=$(grep "^PATCHLEVEL = " Makefile | awk '{print $3}')
          S=$(grep "^SUBLEVEL = " Makefile | awk '{print $3}')
          echo "version=${V}.${P}.${S}" >> $GITHUB_OUTPUT
          echo "Building kernel ${V}.${P}.${S}"

      - name: make defconfig (proven set + CI slimming)
        working-directory: kernel/oneplus/sm8450
        run: |
          # CI-only fragment: no debug info (smaller/faster; no ABI impact)
          cat > arch/arm64/configs/vendor/ci_slim.config <<'EOF'
          CONFIG_DEBUG_INFO_NONE=y
          # CONFIG_DEBUG_INFO is not set
          EOF
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          export PATH="$HOME/toolchain/bin:$PATH"
          make O=out ${DEFCONFIGS} vendor/ci_slim.config
          echo "=== key configs ==="
          grep -E "^CONFIG_(MODVERSIONS|MODULES|KPROBES|KSU|OVERLAY_FS|MODULE_SIG)" out/.config || true

      - name: Build kernel Image + DTBs
        working-directory: kernel/oneplus/sm8450
        run: |
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          export PATH="$HOME/toolchain/bin:$PATH"
          make O=out -j$(nproc) Image dtbs 2>&1 | tail -25
          test -f out/arch/arm64/boot/Image || { echo "::error::Image missing"; exit 1; }
          file out/arch/arm64/boot/Image
          V=$(make O=out ARCH=arm64 LLVM=1 kernelrelease 2>/dev/null | tail -1)
          echo "kernelrelease=${V}" >> $GITHUB_ENV
          echo "release: $V"

      - name: Build in-tree modules
        working-directory: kernel/oneplus/sm8450
        run: |
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          export PATH="$HOME/toolchain/bin:$PATH"
          make O=out -j$(nproc) modules 2>&1 | tail -10
          echo "in-tree .ko: $(find out -name '*.ko' | wc -l)"

      - name: Build qcom ext modules (16 proven modules)
        working-directory: kernel/oneplus/sm8450
        run: |
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          export PATH="$HOME/toolchain/bin:$PATH"
          ROOT=$PWD
          MODS=$(realpath $ROOT/../sm8450-modules)
          set -o pipefail
          for m in ${EXT_MODULES}; do
            echo "=== ext module: $m ==="
            test -f "$MODS/$m/Makefile" || { echo "::error::Makefile not found: $MODS/$m"; ls "$MODS" "$MODS/qcom" 2>/dev/null; exit 1; }
            if ! make O=$ROOT/out M=$MODS/$m -j$(nproc) modules 2>&1 | tail -60; then
              echo "::error::ext module failed: $m"; exit 1
            fi
          done

      - name: Collect modules (vendor_boot ramdisk + vendor_dlkm sets)
        working-directory: kernel/oneplus/sm8450
        run: |
          K=$PWD; OUT=$K/out; MODS=$(realpath $K/../sm8450-modules)
          echo "ext-module tree: $MODS"
          # strip debug info from all built modules
          find $OUT $MODS -name '*.ko' -exec $HOME/toolchain/bin/llvm-strip --strip-debug {} \; 2>/dev/null || true
          mkdir -p akmods/vendor_ramdisk/lib/modules akmods/vendor_dlkm/lib/modules
          # index all built .ko by basename
          find $OUT $MODS -name '*.ko' | while read ko; do echo "$(basename $ko)|$ko"; done > /tmp/ko_index.txt
          pick() { # $1=list file, $2=dest
            while read m; do
              hit=$(grep "^$m|" /tmp/ko_index.txt | head -1 | cut -d'|' -f2)
              if [ -n "$hit" ]; then cp "$hit" "$2/"; else echo "  [warn] not built (maybe =y): $m"; fi
            done < "$1"
          }
          curl -sL https://raw.githubusercontent.com/rocko5498/android_device_oneplus_sm8450-common/2ff212ddace121b374e63eb956817422c953f339/modules.load.vendor_boot -o /tmp/load.vendor_boot
          curl -sL https://raw.githubusercontent.com/rocko5498/android_device_oneplus_sm8450-common/2ff212ddace121b374e63eb956817422c953f339/modules.load -o /tmp/load.dlkm
          pick /tmp/load.vendor_boot akmods/vendor_ramdisk/lib/modules
          pick /tmp/load.dlkm akmods/vendor_dlkm/lib/modules
          # blocklist (kernel source root, rocko proven)
          cp modules.vendor_blocklist.msm.waipio akmods/vendor_dlkm/lib/modules/modules.blocklist 2>/dev/null || echo "no blocklist file"
          # load lists for the overlay
          cp /tmp/load.dlkm akmods/vendor_dlkm/lib/modules/modules.load
          echo "vendor_ramdisk modules: $(ls akmods/vendor_ramdisk/lib/modules/*.ko 2>/dev/null | wc -l)"
          echo "vendor_dlkm modules:    $(ls akmods/vendor_dlkm/lib/modules/*.ko 2>/dev/null | wc -l)"

      - name: Free disk (Image preserved, out/ removed before second build tree)
        working-directory: kernel/oneplus/sm8450
        run: |
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/kernel/oneplus/sm8450/Image.final"
          rm -rf out
          df -h / | tail -1

      - name: Build DTB/DTBO images (qcom merge_dtbs flow)
        working-directory: kernel/oneplus/sm8450
        run: |
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          export PATH="$HOME/toolchain/bin:$PATH"
          # fresh DTB output tree (mirrors Lineage kernel.mk)
          make O=out-dtb ${DEFCONFIGS} > /dev/null
          make O=out-dtb -j$(nproc) dtbs > /dev/null 2>&1
          DTS=out-dtb/arch/arm64/boot/dts
          mkdir -p dtb-base dtb-out
          # move base blobs (dtb + dtbo) out of vendor — exactly Lineage kernel.mk DTBS_BASE flow;
          # overlays remaining under $DTS/vendor are picked up by --techpack
          mv $DTS/vendor/*/*.dtb $DTS/vendor/*/*.dtbo dtb-base/
          # merge_dtbs.py already fetched + patched in env step
          python3 /tmp/merge_dtbs.py --base dtb-base --techpack $DTS/vendor --out dtb-out
          # fetch AOSP mkdtboimg.py
          curl -sL "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT" | base64 -d > /tmp/mkdtboimg.py
          python3 /tmp/mkdtboimg.py create dtbo.img --page_size=4096 $(find dtb-out -type f -name '*.dtbo' | sort)
          cat $(find dtb-out -type f -name '*.dtb' | sort) > dtb.img
          python3 /tmp/mkdtboimg.py dump dtbo.img | grep -E "dt_entry_count|dt_size" | head -4
          ls -la dtbo.img dtb.img

      - name: Assemble AnyKernel3 zip (Image + dtb + dtbo + modules)
        run: |
          K=$PWD/kernel/oneplus/sm8450
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github
          cp $K/anykernel_udon.sh ak3/anykernel.sh
          cp $K/Image.final ak3/Image
          cp $K/dtb.img ak3/dtb
          cp $K/dtbo.img ak3/dtbo.img
          # modules: systemless vendor_dlkm overlay + vendor_boot ramdisk patch
          mkdir -p ak3/modules/vendor_dlkm/lib/modules
          cp -r $K/akmods/vendor_dlkm/lib/modules/. ak3/modules/vendor_dlkm/lib/modules/
          mkdir -p ak3/vendor_ramdisk/lib/modules
          cp -r $K/akmods/vendor_ramdisk/lib/modules/. ak3/vendor_ramdisk/lib/modules/
          V="${{ steps.version.outputs.version }}"
          ZIP="yazhu-kernel-${V}-udon-$(date +%Y%m%d)-${{ github.run_number }}.zip"
          cd ak3 && zip -r9 "../${ZIP}" . -x '*.git*' > /dev/null && cd ..
          echo "ZIP_NAME=${ZIP}" >> $GITHUB_ENV
          echo "=== zip contents (top) ==="
          unzip -l "${ZIP}" | head -18
          echo "modules in zip: $(unzip -l "${ZIP}" | grep -c '\.ko')"

      - name: Validate
        run: |
          test -f "${ZIP_NAME}" || { echo "::error::no zip"; exit 1; }
          unzip -t "${ZIP_NAME}" > /dev/null && echo "zip integrity OK"
          unzip -l "${ZIP_NAME}" | grep -q "dtbo.img" || { echo "::error::dtbo.img missing from zip"; exit 1; }
          unzip -l "${ZIP_NAME}" | grep -q "vendor_ramdisk" || echo "::warning::no vendor_ramdisk modules"
          echo "FINAL: ${ZIP_NAME} ($(du -h ${ZIP_NAME} | cut -f1))"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Create release
        if: github.event.inputs.release == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yazhu-${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: "Yazhu Kernel ${{ steps.version.outputs.version }} (udon)"
          body: |
            Universal flashable kernel for OnePlus 11R (udon/CPH2487)
            - KernelSU ${{ env.KSU_VERSION_TAG }} (builtin)
            - Includes matching kernel modules (vendor_dlkm systemless overlay + vendor_boot ramdisk)
            - Includes dtbo.img (flashed automatically)
            - Compatible: PixelOS / LineageOS / crDroid / Evo / any AOSP 16 + OxygenOS 16.x
            - Flash via TWRP/OrangeFox/custom recovery
            - Base: rocko5498 proven sm8450 stack, LTS 5.10.246
            - Revert: reflash your ROM's boot or `fastboot flash boot stock_boot.img`
          files: |
            ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## udon kernel build" >> $GITHUB_STEP_SUMMARY
          echo "| version | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| zip | ${ZIP_NAME:-none} |" >> $GITHUB_STEP_SUMMARY
          echo "| status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
